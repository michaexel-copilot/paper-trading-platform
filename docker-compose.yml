# Paper trading platform behind Traefik (e.g. the Hostinger "Ubuntu with Docker and
# Traefik" VPS template). Traefik terminates TLS and routes by host name.
#
#   cp .env.docker.example .env && docker compose up -d
#
# The Hostinger Traefik runs with network_mode: host and the Docker provider, so it
# reaches this container on the default compose network. TRAEFIK_ENTRYPOINT and
# TRAEFIK_CERTRESOLVER must match its --entrypoints / --certificatesresolvers flags
# (Hostinger template: websecure, letsencrypt).
services:
  paper-trading:
    # Built by .github/workflows/docker-image.yml. To build locally instead, replace
    # `image` with `build: .`.
    image: ghcr.io/michaexel-copilot/paper-trading-platform:latest
    container_name: paper-trading
    restart: unless-stopped
    environment:
      COOKIE_SECURE: "true"
      # CHAIN_CRYPTO: okx
      # Platform-separation gate (Auflage 1/2, HED-36 Abschnitt 3). Empty/false by
      # default so existing non-Hedgeclip deployments of this compose file are
      # unaffected. Hedgeclip deployments MUST set both in .env -- see
      # deploy/hedgeclip.env.example for why an unset gate is the company's named top
      # risk, not a cosmetic default. ARTEFAKT_ART is not set here: the image already
      # bakes it in at build time (Dockerfile ARG ARTEFAKT_ART) and an empty override
      # here would defeat the Auflage-4 build-time removal of app/trading/papier.
      ENFORCE_STARTGATTER: ${ENFORCE_STARTGATTER:-false}
      BETRIEBSART: ${BETRIEBSART:-}
    volumes:
      - paper-trading-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.paper-trading.rule=Host(`${TRADING_DOMAIN:-trading.michaexel.de}`)
      - traefik.http.routers.paper-trading.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.paper-trading.tls=true
      - traefik.http.routers.paper-trading.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.paper-trading.loadbalancer.server.port=8000

volumes:
  paper-trading-data:
